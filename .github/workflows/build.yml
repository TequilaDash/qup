name: Build ReSign

# 🔴 构建与发版分离（用户规矩：发版必须复用已验证产物，绝不重复构建）：
#   - 本 workflow = 验证构建（仅手动触发），deb 产物上传为 artifact 保存 90 天
#   - tag + Release = release.yml（输入已验证 run_id，直接下载 artifact 发版）
on:
  workflow_dispatch: {}

# 🔴 v2.1.0：同一 tag force push 会堆积多个排队 run（互相干扰、浪费名额）。
# concurrency：同 ref 只保留最新，旧 run 自动取消。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write # 诊断步骤用：失败时把构建错误发成 issue（CI 日志下载被本机网络 SNI 拦截时的取证通道）

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🔴 v2.2.6→v2.2.7：Xcode 27（Swift 6.4 编译器）编译。
      # 切 Xcode 27（iOS 27 SDK）编译后自动适配最新 SDK 特性（部署目标仍 16.0）。
      - name: Set up Xcode 27
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: "Diagnostic: 工具链版本（Xcode / Swift）"
        run: |
          xcodebuild -version
          swiftc --version
          echo "=== 工程语言模式（project.pbxproj）==="
          grep -E "SWIFT_VERSION|SWIFT_DEFAULT_ACTOR_ISOLATION|SWIFT_APPROACHABLE_CONCURRENCY" RePro.xcodeproj/project.pbxproj | sort -u

      - name: Install dependencies
        run: |
          set -e
          echo "Installing ldid and dpkg..."
          brew install ldid dpkg 2>/dev/null || { echo "brew install failed, trying again..."; brew install ldid dpkg; }
          echo "ldid: $(command -v ldid || echo MISSING)"
          echo "dpkg-deb: $(command -v dpkg-deb || echo MISSING)"
          if ! command -v dpkg-deb &>/dev/null; then
            echo "dpkg-deb not found, installing via brew..."
            brew install dpkg
          fi

      # App 用 OpenSSL 1.1.x（CSR/签名兼容性），zsign 用 3.x（需要 provider API）
      - name: Cache OpenSSL 1.1.x for App (iOS arm64)
        id: openssl11-cache
        uses: actions/cache@v4
        with:
          path: /tmp/openssl-ios
          key: openssl-ios-1.1.1w-${{ runner.os }}

      - name: Build OpenSSL 1.1.x for iOS arm64 (App)
        if: steps.openssl11-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          # OpenSSL 1.1.1w — 最后一个 1.1.x LTS，CSR/签名需要此版本。
          # 3.x 静态链接 default provider 不自动激活导致 CSR 生成失败。
          rm -rf /tmp/openssl-ios-src
          git clone --depth 1 --branch OpenSSL_1_1_1w https://github.com/openssl/openssl.git /tmp/openssl-ios-src
          cd /tmp/openssl-ios-src
          export CROSS_TOP=$(xcrun --sdk iphoneos --show-sdk-platform-path)/Developer
          export CROSS_SDK=$(basename $(xcrun --sdk iphoneos --show-sdk-path))
          ./Configure ios64-xcrun no-shared no-tests no-asm --prefix=/tmp/openssl-ios > /dev/null
          make -j$(sysctl -n hw.ncpu) > /dev/null 2>&1
          make install_sw > /dev/null 2>&1
          ls -la /tmp/openssl-ios/lib/

      - name: Cache OpenSSL 3.x for zsign (iOS arm64)
        id: openssl3-cache
        uses: actions/cache@v4
        with:
          path: /tmp/openssl3-ios
          key: openssl3-ios-3.4.1-${{ runner.os }}

      - name: Build OpenSSL 3.x for iOS arm64 (zsign)
        if: steps.openssl3-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          # zsign 需要 OpenSSL 3.x 的 OSSL_PROVIDER_load 等 API。
          OPENSSL_VER=3.4.1
          rm -rf /tmp/openssl3-ios-src
          git clone --depth 1 --branch "openssl-${OPENSSL_VER}" https://github.com/openssl/openssl.git /tmp/openssl3-ios-src
          cd /tmp/openssl3-ios-src
          export CROSS_TOP=$(xcrun --sdk iphoneos --show-sdk-platform-path)/Developer
          export CROSS_SDK=$(basename $(xcrun --sdk iphoneos --show-sdk-path))
          ./Configure ios64-xcrun no-shared no-tests no-asm --prefix=/tmp/openssl3-ios > /dev/null
          make -j$(sysctl -n hw.ncpu) > /dev/null 2>&1
          make install_sw > /dev/null 2>&1
          ls -la /tmp/openssl3-ios/lib/

      - name: Build iOS App (ReSign)
        run: |
          set -uo pipefail

          # 本项目无第三方依赖，直接用 xcodeproj 构建（无 CocoaPods / SwiftPM）
          echo "=== 开始 xcodebuild ==="
          xcodebuild -project RePro.xcodeproj \
            -scheme ReSign \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build \
            > build.log 2>&1 || {
              echo "=== xcodebuild 失败，完整日志（前 200 行 + 错误行）： ==="
              grep -nE "error:|fatal error:|Undefined symbol|does not contain a scheme|BUILD FAILED" build.log | head -50
              echo "=== 日志尾部 80 行 ==="
              tail -80 build.log
              exit 1
            }

          echo "=== xcodebuild 成功，最后 30 行： ==="
          tail -30 build.log

          # 检查构建产物
          APP_PATH=$(find build -name "ReSign.app" -type d | head -1)
          if [ ! -d "$APP_PATH" ]; then
            echo "error: ReSign.app not found"
            echo "=== 构建日志最后 120 行 ==="
            tail -120 build.log
            exit 1
          fi
          echo "Built app at $APP_PATH"

      - name: Build root helper (repro-helper)
        # 本项目已经没有常驻守护进程。需要 root 的两件事（跨沙箱复制 IPA、
        # 把描述文件写进 /var/Managed Preferences/mobile）交给一个 setuid root
        # 的一次性小工具 repro-helper，由 App 用 posix_spawn 按需拉起。
        # 它只依赖 Foundation + CommonCrypto（在 libSystem 里），一条 clang 就够。
        run: |
          set -e
          mkdir -p build

          xcrun -sdk iphoneos clang \
            -x objective-c -fobjc-arc \
            -arch arm64 -miphoneos-version-min=15.0 \
            -O2 \
            -framework Foundation \
            -o build/repro-helper \
            Helper/repro-helper.m 2>&1 | tee helper_build.log

          if [ ! -f build/repro-helper ]; then
            echo "error: repro-helper build failed"
            cat helper_build.log
            exit 1
          fi

          file build/repro-helper
          chmod +x build/repro-helper
          echo "root helper built successfully"

      - name: Build profile daemon (repro-profiledaemon) for RootHide
        # RootHide 下 App 进程在 jbroot namespace 内，其 MCProfileConnection XPC 与
        # 对 /var/Managed Preferences/mobile 的写入都被重定向到 overlay（假成功），
        # 导致 installd 校验时 0xe8008015。repro-profiledaemon 由 launchd 在系统级
        # 上下文启动（不在 App namespace 内），写真实路径并直连真实 profiled。
        # App 通过 notify(3) + 真实共享路径触发安装。
        run: |
          set -e
          mkdir -p build

          xcrun -sdk iphoneos clang \
            -x objective-c -fobjc-arc \
            -arch arm64 -miphoneos-version-min=15.0 \
            -O2 \
            -framework Foundation \
            -lobjc \
            -o build/repro-profiledaemon \
            Helper/repro-profiledaemon.m 2>&1 | tee profiledaemon_build.log

          if [ ! -f build/repro-profiledaemon ]; then
            echo "error: repro-profiledaemon build failed"
            cat profiledaemon_build.log
            exit 1
          fi

          file build/repro-profiledaemon
          chmod +x build/repro-profiledaemon
          echo "profile daemon built successfully"

      - name: Build signing daemon (repro-signingd)
        # 🆕 v2.1.0：signingd 直接集成交付满签名管线（原版 ReProvision 架构）。
        # 不再依赖唤醒 App → 不存在「等 notify 卡死」的脆弱环节。
        # 编译包含 Vendor 下全部签名源码 + libplist + OpenSSL 1.1.x（CSR 生成）。
        run: |
          set -e
          mkdir -p build

          OPENSSL_DIR=/tmp/openssl-ios

          # bash 数组（路径含空格时避免被拆成分隔符）
          # 🔴 v2.1.0 精简：daemon 凭据已缓存，不需要完整登录流。
          # RPVLoginImpl(SRP+corecrypto) / RPVLoginFallbackImpl(AuthKit UI) /
          # RPVAuthentication(门面) / RPVAccountChecker(检查) / ccsrp(SRP加密)
          # 均排除。Anisette 由 daemon 内直接 dlopen AuthKit 生成。
          SRC_OBJC=(
            Helper/repro-signingd.m
            Vendor/ReProvision/libProvision/EEBackend.m
            "Vendor/ReProvision/libProvision/Provisioning/EEProvisioning.mm"
            "Vendor/ReProvision/libProvision/Apple Services/EEAppleServices.m"
            "Vendor/ReProvision/libProvision/Apple Services/NSData+GZIP.m"
            "Vendor/ReProvision/libProvision/Signing/RZSignRunner.m"
            Vendor/ReProvision/Resources/RPVResources.m
            Vendor/ReProvision/libProvision/SAMKeychain/SAMKeychain.m
            Vendor/ReProvision/libProvision/SAMKeychain/SAMKeychain/SAMKeychainQuery.m
            "Vendor/ReProvision/Application Database/RPVApplication.m"
            Helper/SSZipArchiveStub.m
            Helper/DaemonStubs.m
          )

          SRC_LIBPLIST=(
            Vendor/ReProvision/libProvision/libplist/base64.c
            Vendor/ReProvision/libProvision/libplist/bplist.c
            Vendor/ReProvision/libProvision/libplist/bytearray.c
            Vendor/ReProvision/libProvision/libplist/hashtable.c
            Vendor/ReProvision/libProvision/libplist/libcnary/iterator.c
            Vendor/ReProvision/libProvision/libplist/libcnary/list.c
            Vendor/ReProvision/libProvision/libplist/libcnary/node.c
            Vendor/ReProvision/libProvision/libplist/libcnary/node_iterator.c
            Vendor/ReProvision/libProvision/libplist/libcnary/node_list.c
            Vendor/ReProvision/libProvision/libplist/plist.c
            Vendor/ReProvision/libProvision/libplist/ptrarray.c
            Vendor/ReProvision/libProvision/libplist/time64.c
            Vendor/ReProvision/libProvision/libplist/xplist.c
            Vendor/ReProvision/libProvision/libplist/Array.cpp
            Vendor/ReProvision/libProvision/libplist/Boolean.cpp
            Vendor/ReProvision/libProvision/libplist/Data.cpp
            Vendor/ReProvision/libProvision/libplist/Date.cpp
            Vendor/ReProvision/libProvision/libplist/Dictionary.cpp
            Vendor/ReProvision/libProvision/libplist/Integer.cpp
            Vendor/ReProvision/libProvision/libplist/Key.cpp
            Vendor/ReProvision/libProvision/libplist/Node.cpp
            Vendor/ReProvision/libProvision/libplist/Real.cpp
            Vendor/ReProvision/libProvision/libplist/String.cpp
            Vendor/ReProvision/libProvision/libplist/Structure.cpp
            Vendor/ReProvision/libProvision/libplist/Uid.cpp
          )

          # 🔴 v2.1.0 fix10: ChOma 源码（EEBackend 的 fat_*/csd_* 签名描述符号）
          SRC_CHOMA=(
            Vendor/ChOma/arm64.c
            Vendor/ChOma/Base64.c
            Vendor/ChOma/BufferedStream.c
            Vendor/ChOma/CodeDirectory.c
            Vendor/ChOma/CSBlob.c
            Vendor/ChOma/DER.c
            Vendor/ChOma/DyldSharedCache.c
            Vendor/ChOma/Entitlements.c
            Vendor/ChOma/Fat.c
            Vendor/ChOma/FileStream.c
            Vendor/ChOma/Host.c
            Vendor/ChOma/MachO.c
            Vendor/ChOma/MachOLoadCommand.c
            Vendor/ChOma/MemoryStream.c
            Vendor/ChOma/PatchFinder.c
            Vendor/ChOma/PatchFinder_arm64.c
            Vendor/ChOma/Util.c
          )

          INC_DIRS=(
            -IVendor/ReProvision
            -IVendor/ReProvision/libProvision
            "-IVendor/ReProvision/libProvision/Provisioning"
            "-IVendor/ReProvision/libProvision/Apple Services"
            "-IVendor/ReProvision/libProvision/Signing"
            -IVendor/ReProvision/libProvision/SAMKeychain
            -IVendor/ReProvision/libProvision/SAMKeychain/SAMKeychain
            -IVendor/ReProvision/libProvision/libplist/include
            "-IVendor/ReProvision/libProvision/CoreCrypt"
            -IVendor/ReProvision/corecrypto
            "-IVendor/ReProvision/Application Database"
            -IVendor/ReProvision/Resources
            -IVendor/ReProvision/libProvision/SSZipArchive
            -IVendor/ReProvision/Support
            -IVendor/ChOma
            -IHelper
            "-I${OPENSSL_DIR}/include"
          )

          # 🔴 不设 -x objective-c：.m → ObjC, .mm → ObjC++, .c → C, .cpp → C++
          # EEProvisioning.mm 用 <cstdio> 等 C++ 标准头，必须走 ObjC++ 编译。
          xcrun -sdk iphoneos clang \
            -fobjc-arc \
            -arch arm64 -miphoneos-version-min=15.0 \
            -O2 \
            -framework Foundation -framework CoreFoundation -framework Security -framework MobileCoreServices \
            "${INC_DIRS[@]}" \
            "-L${OPENSSL_DIR}/lib" -lssl -lcrypto -lc++ -lobjc \
            -o build/repro-signingd \
            "${SRC_OBJC[@]}" \
            "${SRC_LIBPLIST[@]}" \
            "${SRC_CHOMA[@]}" \
            2>&1 | tee signingd_build.log

          if [ ! -f build/repro-signingd ]; then
            echo "error: repro-signingd build failed"
            cat signingd_build.log
            exit 1
          fi

          file build/repro-signingd
          chmod +x build/repro-signingd
          echo "signing daemon built successfully (v2.1.0: self-contained signing pipeline)"

      - name: Cross-compile zsign for iOS (arm64)
        # zsign 是设备端签名后端（纯 C/C++，仅依赖 OpenSSL）。
        # zlib/minizip 已内嵌在其源码树中。交叉编译为 iOS arm64 静态链接版，
        # 输出 /tmp/zsign，后续打包阶段复制到三套 deb 的正确路径。
        run: |
          set -e
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "iPhoneOS SDK: $SDK"

          OPENSSL_DIR=/tmp/openssl3-ios

          # zsign 源码（pinned commit 保证可重现构建）
          ZSIGN_COMMIT=d6e929c97b5b564c2cc1f82afe226a44da7149a0
          ZS_OBJ=/tmp/zsign-obj
          rm -rf /tmp/zsign-src "$ZS_OBJ"
          git clone --depth 1 https://github.com/zhlynn/zsign.git /tmp/zsign-src
          cd /tmp/zsign-src
          git fetch --depth 1 origin "${ZSIGN_COMMIT}"
          git checkout "${ZSIGN_COMMIT}"
          mkdir -p "$ZS_OBJ"

          CFLAGS="-isysroot $SDK -arch arm64 -mios-version-min=12.0 -O3"
          CXXFLAGS="-isysroot $SDK -arch arm64 -mios-version-min=12.0 -O3 -std=c++11"

          # zlib（C 模式——minizip 的 zip.c 传 void* 给 crc32()，C++ 下隐式转换非法）
          for f in src/third-party/zlib/*.c; do
            clang $CFLAGS -I src/third-party/zlib -c "$f" -o "$ZS_OBJ/$(echo "$f" | tr '/' '_').o"
          done

          # minizip（C 模式）
          for f in src/third-party/minizip/ioapi.c src/third-party/minizip/zip.c src/third-party/minizip/unzip.c; do
            clang $CFLAGS -I src -I src/common -I src/third-party/zlib -c "$f" -o "$ZS_OBJ/$(echo "$f" | tr '/' '_').o"
          done

          # zsign 核心 + common（C++）
          for f in src/*.cpp src/common/*.cpp; do
            clang++ $CXXFLAGS -I src -I src/common -I src/third-party/zlib \
              -I ${OPENSSL_DIR}/include -DZSIGN_VERSION="${ZSIGN_COMMIT:0:8}" \
              -c "$f" -o "$ZS_OBJ/$(echo "$f" | tr '/' '_').o"
          done

          # 链接（静态链接 OpenSSL）
          clang++ $CXXFLAGS "$ZS_OBJ"/*.o \
            -L ${OPENSSL_DIR}/lib -lssl -lcrypto \
            -o /tmp/zsign
          cd -

          echo "=== zsign binary (expect Mach-O arm64 for iOS) ==="
          file /tmp/zsign
          lipo -info /tmp/zsign
          ls -lh /tmp/zsign
          echo "zsign built successfully"

      - name: Sign with entitlements + 打包资源
        run: |
          set -e
          LDID=$(command -v ldid)

          if [ -z "$LDID" ]; then
            echo "ldid not available, skipping CI signing (device-side zsign will sign at runtime)"
          else
            echo "Using ldid: $LDID"
          fi

          do_sign() {
            local bin="$1" plist="$2"
            if [ -n "$LDID" ]; then
              echo "Signing $bin with $plist"
              "$LDID" -S"$plist" "$bin"
            else
              echo "Skipping sign for $bin (no ldid)"
            fi
          }

          do_sign_bare() {
            local bin="$1"
            if [ -n "$LDID" ]; then
              echo "Bare-signing $bin"
              "$LDID" -S "$bin"
            else
              echo "Skipping bare sign for $bin (no ldid)"
            fi
          }

          # 🔀 v2.1.28：rootless(Dopamine)/rootful 包在 main 分支单独构建/发布；本 roothide 分支只构建 roothide。

          # --- RootHide deb ---
          PKG3="Packages/roothide"
          # 🔴 v2.2.0 修复：每个 run: 步骤是独立 shell，Build iOS App 步骤里局部的
          # APP_PATH 不会带到这里，必须在本步骤自行定位 ReSign.app，否则 $APP_DIR 为空
          # → `cp -R "" ...` 报错（验证 run 31269658745 即因此失败）。
          APP_DIR=$(find build -name "ReSign.app" -type d | head -1)
          if [ ! -d "$APP_DIR" ]; then
            echo "error: ReSign.app not found under build/ (xcodebuild 是否成功？)"
            exit 1
          fi
          mkdir -p "$PKG3/Applications" "$PKG3/usr/libexec" "$PKG3/usr/local/bin" \
                   "$PKG3/usr/share/reprovision/certificates" \
                   "$PKG3/Library/LaunchDaemons"
          cp -R "$APP_DIR" "$PKG3/Applications/"
          cp build/repro-helper "$PKG3/usr/libexec/"
          cp build/repro-profiledaemon "$PKG3/usr/libexec/"
          cp build/repro-signingd "$PKG3/usr/libexec/"
          cp /tmp/zsign "$PKG3/usr/local/bin/zsign"
          chmod 0755 "$PKG3/usr/local/bin/zsign"
          cp Resources/Certificates/*.pem "$PKG3/usr/share/reprovision/certificates/"
          cp Resources/Icon.png "$PKG3/Applications/ReSign.app/Icon.png"
          cp Resources/cn.analy.resign.profiledaemon.plist "$PKG3/Library/LaunchDaemons/"
          # v1.1.65：roothide 用专属 LaunchDaemon plist（带 _MSSafeMode=1/_SafeMode=1，
          # 否则 RootHide 运行时剥离 backboardd.launchapplications → SBSLaunch 返回 7）
          cp Resources/cn.analy.resign.signingd-roothide.plist "$PKG3/Library/LaunchDaemons/cn.analy.resign.signingd.plist"
          do_sign "$PKG3/Applications/ReSign.app/ReSign" Resources/entitlements-roothide.plist
          do_sign "$PKG3/usr/libexec/repro-helper" Resources/entitlements-roothide-helper.plist
          do_sign "$PKG3/usr/libexec/repro-profiledaemon" Resources/entitlements-profiledaemon.plist
          chmod 0755 "$PKG3/usr/libexec/repro-signingd"
          do_sign "$PKG3/usr/libexec/repro-signingd" Resources/entitlements-signingd-roothide.plist
          do_sign_bare "$PKG3/usr/local/bin/zsign"
          chmod 4755 "$PKG3/usr/libexec/repro-helper"

          echo "Signing + packaging complete (roothide only)"

      - name: Package debs
        run: |
          set -e
          # 版本号以 DEBIAN/control 中的 Version 为准（PackageVersion.plist 的 string 字段含空值，grep 易误取）
          VERSION=$(grep -m1 '^Version:' Packages/roothide/DEBIAN/control | awk '{print $2}')
          echo "Version: $VERSION"
          mkdir -p CydiaPackages

          # DEBIAN 维护脚本必须有可执行权限（0555~0775），否则 dpkg-deb 报错
          for pkg in roothide; do
            find "Packages/$pkg/DEBIAN" -type f -exec chmod 0755 {} \;
          done

          dpkg-deb -Zgzip -b Packages/roothide "CydiaPackages/cn.analy.resign_${VERSION}_roothide-iphoneos-arm64e.deb"

          ls -lh CydiaPackages/

      # 🔴 roothide 分支专用护栏：只有「推 tag」或「手动触发并显式填 tag_name」才发布。
      # 否则手动触发（tag_name 留空）会用 github.ref_name=roothide 建出一个名为
      # "roothide" 的垃圾 release + 同名 tag，与分支名撞成歧义 ref。
      # 有了这条 if，就可以先 dispatch 一次纯编译验证，确认绿了再打正式 tag 发布。
      - name: Upload deb artifacts（发版由 release.yml 复用此产物，绝不重复构建）
        uses: actions/upload-artifact@v4
        with:
          name: debs-${{ github.run_id }}
          path: CydiaPackages/*.deb
          retention-days: 90
          if-no-files-found: error

      # 🔴 诊断通道：本机网络对 results-receiver.actions.githubusercontent.com 做 SNI 干扰，
      # CI run 日志下载全部 421 拿不到。失败时把构建错误发成 issue，经 api.github.com 读取。
      # 取证完成后可删除本步骤和上面的 issues: write。
      - name: "Diagnostic: 失败时把构建错误发成 issue"
        if: failure()
        run: |
          set -u
          DIAG=$(mktemp)
          {
            echo "## Run ${{ github.run_id }} ref=${{ github.ref_name }}"
            echo "## 错误行（所有 *.log）:"
            grep -hE "error:|fatal error:|Undefined symbols|BUILD FAILED|clang: error" *.log 2>/dev/null | head -100
            for f in *.log; do
              [ -f "$f" ] || continue
              echo ""
              echo "## $f 尾部 150 行:"
              tail -150 "$f"
            done
          } > "$DIAG"
          python3 - "$DIAG" <<'PYEOF'
          import json, os, sys, urllib.request
          body = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          title = '[CI-DIAG] %s 构建失败 %s' % (os.environ.get('GITHUB_REF_NAME', '?'), os.environ.get('GITHUB_RUN_ID', '?'))
          data = json.dumps({'title': title, 'body': body[:60000]}).encode()
          req = urllib.request.Request('https://api.github.com/repos/%s/issues' % repo, data=data,
                  headers={'Authorization': 'token ' + token, 'Accept': 'application/vnd.github+json'},
                  method='POST')
          try:
              with urllib.request.urlopen(req) as r:
                  print('issue created:', r.status)
          except Exception as e:
              print('issue create failed:', e)
          PYEOF
        env:
          GITHUB_TOKEN: ${{ github.token }}
